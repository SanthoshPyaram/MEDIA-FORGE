    <!-- Dark/Light mode initializer: Defaults to light theme -->
    <script>
      (function() {
        try {
          const storedTheme = localStorage.getItem('mediaforge_theme');
          if (storedTheme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
