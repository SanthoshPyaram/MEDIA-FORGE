<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MediaForge: Transform, convert, compress, and enhance videos, images, audio, and documents directly inside your browser. 100% private, zero server uploads." />
    <title>MediaForge — Private Browser-Based Media & Document Studio</title>
    <!-- Dark/Light mode initializer: Defaults to light theme -->
    <script>
      (function() {
        try {
          const storedTheme = localStorage.getItem('mediaforge_theme');
          if (storedTheme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-[#090d16] text-slate-900 dark:text-slate-100 min-h-screen antialiased selection:bg-indigo-500 selection:text-white transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
